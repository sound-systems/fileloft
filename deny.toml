[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive through Azure SDK async/http stack; no direct safe upgrade is available.
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    # Transitive through AWS SDK's rustls 0.21 stack. Newer rustls-webpki 0.103.x
    # is updated in Cargo.lock; keep these ignores scoped for the older SDK path.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # Transitive through the Azure SDK (azure_core 0.21) http/XML stack. All are
    # DoS/unmaintained advisories with no server-triggerable path in fileloft,
    # and azure_core 0.21 pins http-types 2.x and quick-xml 0.31 with no
    # semver-compatible upgrade available.
    "RUSTSEC-2026-0174", # http-types unmaintained
    "RUSTSEC-2026-0194", # quick-xml quadratic parse (DoS)
    "RUSTSEC-2026-0195", # quick-xml namespace allocation (DoS)
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
