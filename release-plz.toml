# https://release-plz.dev/docs/config
# Version bumps follow Conventional Commits (https://www.conventionalcommits.org/):
# feat → minor, fix → patch, BREAKING CHANGE / ! → major (see Cargo SemVer for Rust).

[workspace]
repo_url = "https://github.com/sound-systems/fileloft"
semver_check = true
pr_labels = ["release"]
release_always = false

[[package]]
name = "fileloft-server"
# Must match `publish` in `crates/fileloft-server/Cargo.toml` (release-only tags, not crates.io)
publish = false
git_only = true
git_tag_name = "fileloft-server-v{{ version }}"

[[package]]
name = "fileloft-integration-tests"
publish = false
release = false

[changelog]
protect_breaking_commits = true
