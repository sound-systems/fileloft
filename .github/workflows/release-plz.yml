# Publishes workspace crates to crates.io using release-plz after CI passes.
#
# Repository setup (one-time):
# - Settings → Actions → General → Workflow permissions: Read and write, and allow creating PRs.
# - Repository secret: CARGO_REGISTRY_TOKEN (crates.io token with publish-new + publish-update).
# - Repository secret: RELEASE_PLZ_TOKEN (fine-grained PAT with contents: write)
#   so release-created tags can trigger downstream Docker workflows.
#   https://release-plz.dev/docs/github/quickstart
# - This workflow is chained from CI via workflow_run so publish/tag creation only
#   runs for tested pushes to main. PR CI completions are ignored by job-level filters.

name: Release-plz

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  release-plz-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: >
      github.repository == 'sound-systems/fileloft' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Open release PR (versions + changelog)
    runs-on: ubuntu-latest
    if: >
      github.repository == 'sound-systems/fileloft' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
