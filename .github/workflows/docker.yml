# Publishes fileloft server images to Docker Hub.
#
# This workflow is triggered by fileloft-server-v* tags generated by release-plz
# after CI passes and a release PR is merged. Manual matching tag pushes can also
# trigger it, so restrict tag push permissions if releases must only come from CI.
#
# Required repository secrets:
# - DOCKERHUB_USERNAME: Docker Hub user or organization account.
# - DOCKERHUB_TOKEN: Docker Hub access token with write access to soundsystems/fileloft.
# - RELEASE_PLZ_TOKEN: configured in release-plz.yml so release-created tags trigger this workflow.

name: Docker

on:
  push:
    tags:
      - "fileloft-server-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/soundsystems/fileloft

jobs:
  build-and-push:
    if: github.repository == 'sound-systems/fileloft'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: fs
            tags: |
              type=match,pattern=fileloft-server-v([0-9]+\.[0-9]+\.[0-9]+.*),group=1
              type=match,pattern=fileloft-server-v([0-9]+\.[0-9]+)\.[0-9]+.*,group=1
              type=match,pattern=fileloft-server-v([0-9]+\.[0-9]+\.[0-9]+.*),group=1,suffix=-fs
              type=raw,value=fs
              type=raw,value=latest
          - backend: s3
            tags: |
              type=match,pattern=fileloft-server-v([0-9]+\.[0-9]+\.[0-9]+.*),group=1,suffix=-s3
              type=raw,value=s3
          - backend: gcs
            tags: |
              type=match,pattern=fileloft-server-v([0-9]+\.[0-9]+\.[0-9]+.*),group=1,suffix=-gcs
              type=raw,value=gcs
          - backend: azure
            tags: |
              type=match,pattern=fileloft-server-v([0-9]+\.[0-9]+\.[0-9]+.*),group=1,suffix=-azure
              type=raw,value=azure
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ matrix.tags }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BACKEND=${{ matrix.backend }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fileloft-${{ matrix.backend }}
          cache-to: type=gha,mode=max,scope=fileloft-${{ matrix.backend }}
          provenance: true
          sbom: true
